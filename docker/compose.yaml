# Требуемая хостовая ОС — Ubuntu 22.04 LTS или новее, ядро Linux 5.15+, Docker Engine 27.5+ и Compose V2 2.32+.
# Для GUI необходима сессия X.Org/X11 с OpenGL 3.3+; Wayland и другие графические серверы не поддерживаются.
# Описываем учебный контейнер для сборки и запуска ROS 2-проекта с MuJoCo.
# Фиксируем имя Compose-проекта, чтобы контейнер и его сеть имели предсказуемые имена.
name: oop-robotics-course

# Описываем сервисы приложения и общие параметры их запуска.
services:
  # Создаём единое рабочее окружение курса.
  course:
    # Даём собранному учебному образу стабильное локальное имя.
    image: oop-robotics-course:jazzy

    # Проверяем и собираем образ перед запуском; изменения Dockerfile или контекста инвалидируют соответствующие слои кеша.
    pull_policy: build

    # Описываем сборку из контекста корня проекта.
    build:
      # Используем каталог проекта как контекст, чтобы монтировать его и копировать файлы при сборке.
      context: ..
      # Выбираем Dockerfile, лежащий рядом с этим Compose-файлом.
      dockerfile: docker/Dockerfile
      # Не обновляем существующий базовый образ автоматически, чтобы запуск не подменял версии зависимостей без явного решения.
      pull: false

    # Перезапускаем контейнер после сбоя, пока пользователь явно его не остановит.
    restart: unless-stopped

    # Запускаем небольшой init-процесс для корректной обработки сигналов и дочерних процессов.
    init: true

    # Используем UID/GID обычного пользователя ubuntu, уже включённого в базовый образ.
    user: "1000:1000"

    # Открываем рабочую директорию внутри контейнера.
    working_dir: /workspace

    # Передаём контейнеру параметры X11-дисплея и путь к файлу авторизации.
    environment:
      # Для графического режима передайте DISPLAY хоста; без него можно запускать MuJoCo в headless-режиме.
      DISPLAY: "${DISPLAY:-:0}"
      # Указываем контейнерный путь к примонтированным X11-учётным данным.
      XAUTHORITY: /tmp/.Xauthority
      # Критически важно: заставляет Qt-приложения (если они есть) использовать X11 (xcb)
      QT_QPA_PLATFORM: "xcb"
      # Отключаем MIT-SHM, который часто недоступен между контейнером и хостовым X-сервером.
      QT_X11_NO_MITSHM: "1"
      # Явно указывает MuJoCo использовать оконный бэкенд GLFW
      MUJOCO_GL: "glfw"
    # Монтируем исходники и X11-сокет с хоста в контейнер.
    volumes:
      # Делаем файлы проекта доступными в рабочей директории контейнера.
      - type: bind
        source: ..
        target: /workspace
      # Передаём локальный X11-сокет для отображения окна MuJoCo на хосте.
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      # Передаём X11-авторизацию только для чтения; путь можно переопределить переменной XAUTHORITY.
      - type: bind
        source: ${XAUTHORITY:-${HOME}/.Xauthority}
        target: /tmp/.Xauthority
        read_only: true

    # Передаём DRM-устройства для аппаратного OpenGL через графический драйвер хоста.
    devices:
      - /dev/dri:/dev/dri

    # Добавляем именованные группы доступа к видеоустройствам, чтобы не было предупреждения для неизвестного GID.
    group_add:
      - video
      - render

    # Оставляем терминал интерактивным для работы через docker compose exec.
    stdin_open: true
    tty: true

    # Не даём учебному контейнеру завершиться после старта; оболочку открывают командой docker compose exec.
    command: ["sleep", "infinity"]
